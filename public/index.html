<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Branch Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="field" aria-hidden="true"><i class="amb"></i><i class="glow"><i class="core"></i></i></div>
  <div id="frost" aria-hidden="true"></div>

  <main id="start-screen">
    <h1>Think out loud. Nothing gets lost.</h1>
    <p class="lede">Talk an idea through. When you change direction, the old thread waits in the background.</p>
    <button id="btn-start" class="primary" type="button">Start talking</button>
    <p id="start-error" class="error" role="alert"></p>
  </main>

  <div id="session-view" hidden>
    <main class="stage">
      <div id="transcript" class="transcript" role="log" aria-live="polite" aria-relevant="additions text" tabindex="0" aria-label="Transcript"></div>
    </main>

    <nav id="branchmap" class="branchmap" aria-label="Branches"></nav>

    <button id="orb" class="orb" type="button" aria-pressed="false" aria-label="Hold to keep talking"></button>

    <footer class="dock">
      <p id="error" class="error" role="alert"></p>
      <p id="hint" class="hint"></p>
      <div class="chromerow chrome">
        <form id="turn-form" class="turn-form" autocomplete="off">
          <input id="turn-input" type="text" placeholder="Type instead" aria-label="Type instead" enterkeyhint="send">
          <button id="btn-send" type="submit" aria-label="Send">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <p id="voice-status" class="status" role="status"></p>
        <button id="btn-end" class="quiet" type="button" hidden>Stop voice</button>
      </div>
    </footer>

    <button id="btn-finish" class="quiet finish chrome" type="button" aria-label="End session">End session</button>

    <div id="map-scrim" class="scrim" aria-hidden="true"></div>
    <section id="map-sheet" class="sheet" role="dialog" aria-labelledby="sheet-title" inert>
      <h2 id="sheet-title">This conversation</h2>
      <nav id="sheet-map" aria-label="All branches"></nav>
      <p class="sheet-note">Tap a branch to switch, or tap outside to close</p>
    </section>
  </div>

  <main id="end-view" class="end-host" hidden></main>

  <script type="module" src="app.js"></script>
</body>
</html>
